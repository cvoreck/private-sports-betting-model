name: Archive Covered ESPN Final Snapshots (No Deletion)
on:
  workflow_dispatch:
    inputs:
      older_than_days:
        description: 'Only archive covered completed-game snapshots older than this many days'
        required: true
        default: '30'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL driver
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Export and verify archive (READ ONLY)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DAYS: ${{ inputs.older_than_days }}
        run: python sports_betting_cloud/archive_completed_snapshots.py --days "$DAYS" --out archive_output
      - name: Upload private archive artifact (download promptly)
        uses: actions/upload-artifact@v4
        with:
          name: covered-espn-final-snapshot-archive
          path: archive_output/
          if-no-files-found: error
          retention-days: 7
