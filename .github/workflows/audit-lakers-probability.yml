name: Audit Lakers Probability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit dependencies
        run: python -m pip install 'psycopg[binary]>=3,<4' 'requests>=2,<3'

      - name: Run read-only Lakers probability audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: sports_betting_cloud
        run: python audit_lakers_probability.py --date 2026-11-02 --team Lakers
