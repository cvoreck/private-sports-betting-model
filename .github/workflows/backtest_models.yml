name: Sports Edge Backtest (Manual)

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backtest dependencies
        run: python -m pip install 'psycopg[binary]>=3.1'
      - name: Run read-only probability backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/backtest_models.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sports-edge-backtest-report
          path: sports_edge_backtest_report.json
          if-no-files-found: warn
