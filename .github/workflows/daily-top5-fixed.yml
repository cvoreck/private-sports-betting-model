
name: Daily Top 5 (06:00 Pacific)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'

permissions:
  contents: read

concurrency:
  group: sports-edge-daily-top5
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r sports_betting_cloud/automation-requirements.txt

      - name: Check Pacific schedule
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo('America/Los_Angeles'))
          manual = os.environ.get('EVENT_NAME') == 'workflow_dispatch'
          should_run = manual or now.hour == 6

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"run={'true' if should_run else 'false'}\n")

          print(f"Pacific time: {now.isoformat()}")
          print('Publishing enabled.' if should_run else 'Skipping duplicate UTC schedule slot.')
          PY

      - name: Generate predictions
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python sports_betting_cloud/prediction_engine.py

      - name: Publish Top 5
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          REQUIRE_SIX_AM: '0'
        run: python sports_betting_cloud/daily_top5.py
