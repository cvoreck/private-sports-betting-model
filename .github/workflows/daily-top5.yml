name: Daily Top 5 (06:00 Pacific)

on:
  schedule:
    # 06:00 PDT = 13:00 UTC; 06:00 PST = 14:00 UTC.
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sports-edge-daily-top5
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r sports_betting_cloud/automation-requirements.txt

      - name: Run only at 06:00 Pacific (or manually)
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          if os.environ.get('EVENT_NAME') != 'workflow_dispatch':
              local_now = datetime.now(ZoneInfo('America/Los_Angeles'))
              if local_now.hour != 6:
                  print(f'Skipping: local Pacific hour is {local_now.hour}, not 6.')
                  sys.exit(0)
          subprocess.run([sys.executable, 'sports_betting_cloud/daily_top5.py'], check=True)
          PY
