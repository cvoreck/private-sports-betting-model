
name: Daily Top 5 (06:00 Pacific)

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Manual recovery: cached skips historical collection and Odds API calls'
        required: true
        type: choice
        default: cached
        options:
          - cached
          - full
  schedule:
    # 06:00 PDT / 06:00 PST; gate below handles DST and late starts.
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: sports-edge-daily-top5
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r sports_betting_cloud/automation-requirements.txt

      - name: Check Pacific schedule and skip existing card
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_MODE: ${{ inputs.run_mode }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_WORKFLOW: daily-top5.yml
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import psycopg
          import json
          from urllib.request import Request, urlopen
          from urllib.error import URLError

          now = datetime.now(ZoneInfo('America/Los_Angeles'))
          today = now.date()
          manual = os.environ.get('EVENT_NAME') == 'workflow_dispatch'
          in_window = 6 <= now.hour <= 7
          eligible = manual or in_window
          should_run = eligible
          reason = 'manual trigger' if manual else ('Pacific morning window' if in_window else 'outside Pacific morning window')

          # Prevent duplicate scheduled processing even if the earlier attempt
          # published no picks. Inspect GitHub run metadata, not Supabase.
          if eligible and not manual:
              url = (f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}"
                     f"/actions/workflows/{os.environ['GH_WORKFLOW']}/runs?event=schedule&per_page=50")
              try:
                  req = Request(url, headers={
                      'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                      'Accept': 'application/vnd.github+json',
                      'User-Agent': 'sports-edge-daily-gate'})
                  with urlopen(req, timeout=15) as response:
                      runs = json.load(response).get('workflow_runs', [])
                  prior = []
                  for run in runs:
                      if int(run.get('run_number') or 0) >= int(os.environ['GH_RUN_NUMBER']):
                          continue
                      if run.get('status') != 'completed' or run.get('conclusion') != 'success':
                          continue
                      created = datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
                      if created.astimezone(ZoneInfo('America/Los_Angeles')).date() == today:
                          prior.append(run['id'])
                  if prior:
                      should_run = False
                      reason = f'Previous successful scheduled run(s) today: {prior}; skip duplicate'
              except (URLError, TimeoutError, ValueError, KeyError, OSError) as exc:
                  # Fail closed to protect egress/credits; manual dispatch remains available.
                  should_run = False
                  reason = f'Cannot verify prior runs ({exc}); skip scheduled attempt safely'

          if should_run:
              with psycopg.connect(os.environ['DATABASE_URL'], connect_timeout=15) as conn:
                  # Skip API calls if today's ranked card already exists.
                  # The picks.date column is stored as TEXT.
                  count = conn.execute('''SELECT COUNT(*) FROM picks
                      WHERE date=%s::text AND kind='Hypothetical' AND rank IS NOT NULL''',
                      (today,)).fetchone()[0]
                  if count:
                      should_run = False
                      reason = f'{count} ranked picks already exist for {today}; skip to avoid repeated research and database traffic'
                  else:
                      reason = f'No ranked picks for {today}; run normal publishing pipeline'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"run={'true' if should_run else 'false'}\n")
              f.write(f"collect={'true' if should_run and (not manual or os.environ.get('RUN_MODE') == 'full') else 'false'}\n")
          print(f'Pacific timestamp: {now.isoformat()}')
          print(f'Trigger: {os.environ.get("EVENT_NAME")}')
          print(f'Run publishing pipeline: {should_run}; reason: {reason}')
          PY

      - name: Settle unresolved picks from previous days (ESPN only)
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/settle_picks.py

      - name: Archive historical game, player and market data
        if: steps.gate.outputs.collect == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ESPN_BACKFILL_DAYS: '7'
          MAX_PROP_EVENT_REQUESTS: '0'
          ODDS_MONTHLY_RESERVE: '50'
          ODDS_MONTHLY_LIMIT: '500'
          # Verify this matches your actual Odds API billing reset day.
          ODDS_RESET_DAY: '1'
        run: python sports_betting_cloud/historical_collector.py

      - name: Update compact completed-games history (no external API calls)
        if: steps.gate.outputs.collect == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/update_compact_history.py

      - name: Generate predictions
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/prediction_engine.py

      - name: Publish Top 5 once
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REQUIRE_SIX_AM: '0'
        run: python sports_betting_cloud/daily_top5.py
