
name: Daily Top 5 (06:00 Pacific)

on:
  workflow_dispatch:
  schedule:
    # Covers 06:00, 07:00 and 08:00 Pacific in both PST and PDT.
    # The Pacific-time gate below rejects other hours.
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'

permissions:
  contents: read

concurrency:
  group: sports-edge-daily-top5
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r sports_betting_cloud/automation-requirements.txt

      - name: Check Pacific schedule and choose publish or research refresh
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import psycopg

          now = datetime.now(ZoneInfo('America/Los_Angeles'))
          today = now.date()
          manual = os.environ.get('EVENT_NAME') == 'workflow_dispatch'
          in_window = 6 <= now.hour <= 8
          eligible = manual or in_window
          should_run = eligible
          refresh = False
          reason = 'manual trigger' if manual else ('Pacific morning window' if in_window else 'outside Pacific morning window')

          if eligible:
              with psycopg.connect(os.environ['DATABASE_URL'], connect_timeout=15) as conn:
                  # Skip API calls if today's ranked card already exists.
                  # The picks.date column is stored as TEXT.
                  count = conn.execute('''SELECT COUNT(*) FROM picks
                      WHERE date=%s::text AND kind='Hypothetical' AND rank IS NOT NULL''',
                      (today,)).fetchone()[0]
                  if count:
                      should_run = False
                      refresh = True
                      reason = f'{count} ranked picks already exist for {today}; refresh saved research only (no Odds API calls)'
                  else:
                      reason = f'No ranked picks for {today}; run normal publishing pipeline'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"run={'true' if should_run else 'false'}\n")
              f.write(f"refresh={'true' if refresh else 'false'}\n")
          print(f'Pacific timestamp: {now.isoformat()}')
          print(f'Trigger: {os.environ.get("EVENT_NAME")}')
          print(f'Run publishing pipeline: {should_run}; refresh existing research: {refresh}; reason: {reason}')
          PY

      - name: Archive historical game, player and market data
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ESPN_BACKFILL_DAYS: '7'
          MAX_PROP_EVENT_REQUESTS: '0'
          ODDS_MONTHLY_RESERVE: '20'
          ODDS_MONTHLY_LIMIT: '500'
          # Verify this matches your actual Odds API billing reset day.
          ODDS_RESET_DAY: '1'
        run: python sports_betting_cloud/historical_collector.py

      - name: Generate predictions
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/prediction_engine.py

      - name: Publish Top 5 or refresh existing research
        if: steps.gate.outputs.run == 'true' || steps.gate.outputs.refresh == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REQUIRE_SIX_AM: '0'
        run: python sports_betting_cloud/daily_top5.py
