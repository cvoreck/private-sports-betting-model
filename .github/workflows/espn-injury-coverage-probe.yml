name: One-time ESPN injury coverage diagnostic
on:
  push:
    branches:
      - diagnostics/espn-injury-coverage-20261125
    paths:
      - '.github/workflows/espn-injury-coverage-probe.yml'
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe ESPN public injury endpoints only
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error
          from collections import Counter
          from urllib.parse import urlencode

          BASE = "https://site.api.espn.com/apis/site/v2/sports/"
          LIMIT = 36
          MAX_BYTES = 4 * 1024 * 1024
          requests = 0
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def get(path, params=None):
              global requests
              if requests >= LIMIT:
                  return None, "REQUEST_CAP"
              requests += 1
              url = BASE + path + ("?" + urlencode(params) if params else "")
              try:
                  req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "SportsEdge-ESPN-coverage-diagnostic/1.0"})
                  with opener.open(req, timeout=8) as r:
                      raw = r.read(MAX_BYTES + 1)
                      if len(raw) > MAX_BYTES:
                          return None, "RESPONSE_CAP"
                      data = json.loads(raw)
                      return (data, "HTTP_200") if isinstance(data, dict) else (None, "UNEXPECTED_JSON")
              except urllib.error.HTTPError as e:
                  return None, "HTTP_" + str(e.code)
              except (OSError, ValueError) as e:
                  return None, type(e).__name__

          def txt(x):
              if isinstance(x, str):
                  return x.strip()
              if isinstance(x, dict):
                  for k in ("displayName", "fullName", "name", "description", "abbreviation", "text", "label"):
                      v = txt(x.get(k))
                      if v:
                          return v
              return ""

          def records(data, fallback_team=""):
              # Only inspect explicit injury containers, not rosters or DNP rows.
              if not isinstance(data, dict) or "injuries" not in data:
                  return None, []
              root = data["injuries"]
              out = set()
              def walk(node, team="", depth=0):
                  if depth > 10:
                      return
                  if isinstance(node, list):
                      for v in node:
                          walk(v, team, depth+1)
                  elif isinstance(node, dict):
                      t = node.get("team")
                      if isinstance(t, dict):
                          team = str(t.get("id") or txt(t) or team)
                      elif isinstance(node.get("displayName"), str) and node.get("id") and isinstance(node.get("injuries"), list):
                          team = str(node["id"])
                      athlete = node.get("athlete") or node.get("player")
                      if athlete:
                          name = txt(athlete)
                          status = txt(node.get("status") or node.get("designation") or node.get("injuryStatus"))
                          if not status and isinstance(node.get("injury"), dict):
                              status = txt(node["injury"].get("status") or node["injury"].get("designation"))
                          if name and status:
                              out.add((team or fallback_team, name, status))
                      for k in ("injuries", "items", "entries", "athletes", "players", "reports", "data"):
                          if isinstance(node.get(k), (list, dict)):
                              walk(node[k], team, depth+1)
              walk(root, fallback_team)
              return type(root).__name__ + ":" + str(len(root) if isinstance(root, (list, dict)) else 0), sorted(out)

          def report(sport, kind, label, data, result, fallback=""):
              shape, rows = records(data, fallback)
              teams = Counter(t for t, _, _ in rows if t)
              # Sample names/statuses only for scoped teams; league-wide outputs are aggregate.
              print(json.dumps({"sport": sport, "endpoint": kind, "label": label,
                  "request": result, "injuries_shape": shape,
                  "records": len(rows), "team_qualified": sum(teams.values()),
                  "teams": dict(teams) if kind != "league" else len(teams),
                  "keys": sorted(data.keys())[:18] if isinstance(data, dict) else [],
                  "sample": rows[:6] if kind != "league" else []}, sort_keys=True), flush=True)
              return rows

          sports = [
              ("College Basketball", "basketball/mens-college-basketball"),
              ("College Football", "football/college-football"),
              ("NFL", "football/nfl"),
              ("NBA", "basketball/nba"),
              ("NHL", "hockey/nhl"),
              ("MLB", "baseball/mlb"),
          ]
          target_names = ("penn state", "memphis", "providence", "byu")
          for sport, path in sports:
              league, status = get(path + "/injuries")
              report(sport, "league", "all teams", league, status)
              date = "20261001" if sport == "MLB" else "20261125"
              if sport == "College Football":
                  date = "20261128"
              board, status = get(path + "/scoreboard", {"dates": date, "limit": 500, **({"groups": 50} if sport == "College Basketball" else {"groups": 80} if sport == "College Football" else {})})
              events = []
              for event in (board or {}).get("events", []):
                  comp = (event.get("competitions") or [{}])[0]
                  teams = [(str(c["team"].get("id", "")), c["team"].get("displayName", "")) for c in comp.get("competitors", []) if isinstance(c.get("team"), dict)]
                  if event.get("id") and len(teams) == 2 and all(t[0].isdigit() for t in teams):
                      events.append((str(event["id"]), teams))
              if sport == "College Basketball":
                  events = [e for e in events if any(any(n in name.lower() for n in target_names) for _, name in e[1])][:2]
              else:
                  events = events[:1]
              print(json.dumps({"sport":sport,"endpoint":"scoreboard","date":date,"request":status,"sample_events":events}), flush=True)
              seen = set()
              if not events and sport == "MLB":
                  # Offseason scoreboard may be empty; sample a bounded team list.
                  data, state = get(path + "/teams", {"limit": 30})
                  teams = []
                  for s in (data or {}).get("sports", []):
                      for l in s.get("leagues", []):
                          for v in l.get("teams", []):
                              t = v.get("team", {})
                              if str(t.get("id", "")).isdigit():
                                  teams.append((str(t["id"]), t.get("displayName", "")))
                  events = [("", teams[:2])] if teams else []
              for event_id, teams in events:
                  for tid, name in teams:
                      if tid in seen:
                          continue
                      seen.add(tid)
                      data, status = get(path + "/teams/" + tid + "/injuries")
                      report(sport, "team", name, data, status, tid)
                  if event_id.isdigit():
                      data, status = get(path + "/summary", {"event":event_id})
                      report(sport, "summary", event_id, data, status)
          print(json.dumps({"diagnostic_complete":True,"espn_requests":requests,"request_cap":LIMIT,"database_queries":0,"odds_api_calls":0}), flush=True)
          PY
