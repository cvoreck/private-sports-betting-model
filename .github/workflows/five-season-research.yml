name: Five-Season Compact History and Recency Research (Manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install database dependency
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Run read-only compact history and recency experiment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/five_season_research.py
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-season-research-report
          path: five_season_research_report.json
          if-no-files-found: warn
