name: Moneyline Adjustment and College Matching Audit (Manual)

on:
  pull_request:
    paths:
      - 'sports_betting_cloud/espn_event_match.py'
      - 'sports_betting_cloud/ap_rankings_verifier.py'
      - 'sports_betting_cloud/prediction_engine.py'
      - 'sports_betting_cloud/daily_top5.py'
      - 'sports_betting_cloud/moneyline_adjustment_audit.py'
      - 'sports_betting_cloud/test_moneyline_college_coverage.py'
      - '.github/workflows/moneyline-college-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression tests
        run: python -m unittest discover -s sports_betting_cloud -p test_moneyline_college_coverage.py -v
      - name: Install read-only database driver
        if: github.event_name == 'workflow_dispatch'
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Run read-only historical moneyline comparison
        if: github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/moneyline_adjustment_audit.py
      - name: Upload comparison report
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyline-adjustment-observational-audit
          path: reports/moneyline_adjustment_audit.json
          if-no-files-found: warn
