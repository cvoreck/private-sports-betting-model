name: Moneyline Adjustment and College Matching Audit (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression tests
        run: python -m unittest discover -s sports_betting_cloud -p test_moneyline_college_coverage.py -v
      - name: Install read-only database driver
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Run read-only historical moneyline comparison
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/moneyline_adjustment_audit.py
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyline-adjustment-observational-audit
          path: reports/moneyline_adjustment_audit.json
          if-no-files-found: warn
