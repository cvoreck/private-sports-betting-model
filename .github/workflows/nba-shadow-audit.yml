name: Sports Edge NBA Shadow Audit (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nba-shadow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL driver
        run: python -m pip install 'psycopg[binary]'
      - name: Compare saved NBA probabilities with shadow calibration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/nba_shadow_audit.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sports-edge-nba-shadow-report
          path: |
            nba_shadow_audit_report.json
            nba_shadow_comparisons.csv
          if-no-files-found: warn
