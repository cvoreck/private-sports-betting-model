name: Phase 4 Historical Odds Audit (READ ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL client
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Audit existing snapshots (no writes, no API calls)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/phase4_odds_audit.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-odds-audit-report
          path: phase4_odds_audit_report.json
          if-no-files-found: warn
          retention-days: 30
