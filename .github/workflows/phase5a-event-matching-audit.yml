name: Phase 5A Event Matching Audit (READ ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL driver
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Audit event matching (no writes or API calls)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/phase5a_event_matching_audit.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5a-event-matching-report
          path: phase5a_event_matching_report.json
          if-no-files-found: warn
          retention-days: 30
