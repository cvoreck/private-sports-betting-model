name: Phase 5B Real-Line Backtest (READ ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL driver
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Test scoring, odds and historical-time safeguards
        run: python -m unittest discover -s sports_betting_cloud -p 'test_phase5b_real_line_backtest.py' -v
      - name: Backtest real historical sportsbook lines (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/phase5b_real_line_backtest.py
      - name: Upload Phase 5B research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5b-real-line-backtest-report
          path: phase5b_real_line_backtest_report.json
          if-no-files-found: warn
          retention-days: 30
