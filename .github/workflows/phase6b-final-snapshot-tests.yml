name: Phase 6B Archived Final Grading Safeguards

on:
  pull_request:
    paths:
      - 'sports_betting_cloud/phase6b_shadow_tracker.py'
      - 'sports_betting_cloud/test_phase6b_espn_final_fallback.py'
      - 'sports_betting_cloud/test_phase6b_shadow_tracker.py'
      - '.github/workflows/phase6b-final-snapshot-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safeguard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies for pure logic tests
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Compile safe grader
        run: python -m py_compile sports_betting_cloud/phase6b_shadow_tracker.py
      - name: Verify existing immutable-ledger safeguards
        run: python -m unittest discover -s sports_betting_cloud -p test_phase6b_shadow_tracker.py -v
      - name: Verify ESPN archived final fallback
        run: python -m unittest discover -s sports_betting_cloud -p test_phase6b_espn_final_fallback.py -v
