name: Sports Edge Rolling Calibration (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rolling-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Run read-only rolling calibration audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/rolling_calibration_audit.py
      - name: Run read-only betting-edge audit
        if: success() || failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/betting_edge_audit.py
      - name: Run read-only NHL rolling diagnostic
        if: success() || failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/nhl_rolling_diagnostic.py
      - name: Run read-only NHL feature and Elo experiment
        if: success() || failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/nhl_model_experiment.py
      - name: Upload combined model audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sports-edge-model-audit-reports
          path: |
            sports_edge_rolling_calibration_report.json
            reports/betting_edge_audit.json
            nhl_rolling_diagnostic_report.json
            nhl_model_experiment_report.json
          if-no-files-found: warn
