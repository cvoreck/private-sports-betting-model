name: Spread and Total Phase 3 (READ ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install database driver
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Run read-only rolling backtests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/spread_total_research_phase3.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: spread-total-phase3-report
          path: spread_total_phase3_report.json
          if-no-files-found: error
