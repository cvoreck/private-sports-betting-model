name: Spread and Total Research (READ ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install database driver
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Run read-only research
        run: python sports_betting_cloud/spread_total_research.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spread-total-research-report
          path: spread_total_research_report.json
          if-no-files-found: warn
          retention-days: 30
