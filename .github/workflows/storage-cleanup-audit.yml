name: Storage Cleanup Audit (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install database client
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Audit snapshot coverage (no writes, no API calls)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/storage_cleanup_audit.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-cleanup-audit-report
          path: storage_cleanup_audit_report.json
          if-no-files-found: warn
