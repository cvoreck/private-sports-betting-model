name: One-time neutral-site settlement verification
on:
  push:
    branches:
      - diagnostics/usc-neutral-settlement-20261127
    paths:
      - '.github/workflows/usc-neutral-settlement-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify actual patched settlement (three ESPN requests maximum)
        run: |
          python3 - <<'PY'
          import ast, datetime as dt, json, logging, re, sys, urllib.request, urllib.parse
          from pathlib import Path
          from zoneinfo import ZoneInfo
          sys.path.insert(0, "sports_betting_cloud")
          from espn_event_match import scoreboard_params
          names = {"norm","scoreboard","teams_and_scores","_neutral_college_reverse_match","event_match","grade_pick"}
          nodes = [n for n in ast.parse(Path("sports_betting_cloud/settle_picks.py").read_text()).body if isinstance(n, ast.FunctionDef) and n.name in names]
          assert {n.name for n in nodes} == names
          ns = {"re":re,"date":dt.date,"datetime":dt.datetime,"PT":ZoneInfo("America/Los_Angeles"),
                "LOG":logging.getLogger("probe"),"ESPN":{"College Basketball":("basketball","mens-college-basketball")},"scoreboard_params":scoreboard_params}
          exec(compile(ast.Module(body=nodes,type_ignores=[]),"settle_picks.py","exec"),ns)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          class Response:
              def __init__(self,data):
                  self.data=data
              def raise_for_status(self):
                  pass
              def json(self):
                  return self.data
          class Session:
              attempts=0
              def get(self,url,params,timeout):
                  assert self.attempts<3
                  self.attempts+=1
                  req=urllib.request.Request(url+"?"+urllib.parse.urlencode(params),headers={"User-Agent":"SportsEdgeSettlementProbe/1.0"})
                  with urllib.request.build_opener(NoRedirect()).open(req,timeout=12) as response:
                      raw=response.read(16*1024*1024+1)
                  assert len(raw)<=16*1024*1024
                  return Response(json.loads(raw))
          logging.basicConfig(level=logging.INFO)
          session=Session()
          events={}
          for day in (25,26,27):
              for e in ns["scoreboard"](session,"College Basketball",dt.date(2026,11,day)):
                  if e.get("id"):
                      events[e["id"]]=e
          row={"id":125,"date":"2026-11-26","sport":"College Basketball","matchup":"Utah State Aggies @ USC Trojans","market":"h2h","selection":"USC Trojans"}
          match=ns["event_match"](row,list(events.values()))
          result={"requests":session.attempts,"database_queries":0,"paid_api_calls":0,"unique_events":len(events),"matched":bool(match)}
          if match:
              e,p=match
              result.update({"event_id":e["id"],"date":e["date"],"home_score":p[2],"away_score":p[3],"completed":p[4],"grade":ns["grade_pick"](row,p),"neutral_site":e["competitions"][0]["neutralSite"]})
          print(json.dumps(result),flush=True)
          assert result.get("event_id")=="401921673" and result.get("grade")=="Loss" and result.get("neutral_site") is True
          PY
