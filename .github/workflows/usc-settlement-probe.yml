name: One-time USC settlement verification
on:
  push:
    branches:
      - diagnostics/usc-settlement-20261127
    paths:
      - '.github/workflows/usc-settlement-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare original and expanded ESPN feeds (six requests maximum)
        run: |
          python3 - <<'PY'
          import ast, datetime as dt, json, logging, re, sys, urllib.request, urllib.parse
          from pathlib import Path
          from zoneinfo import ZoneInfo
          sys.path.insert(0, "sports_betting_cloud")
          from espn_event_match import scoreboard_params
          source = Path("sports_betting_cloud/settle_picks.py").read_text()
          names = {"norm", "scoreboard", "teams_and_scores", "event_match", "grade_pick"}
          nodes = [n for n in ast.parse(source).body if isinstance(n, ast.FunctionDef) and n.name in names]
          assert {n.name for n in nodes} == names
          ns = {"re": re, "date": dt.date, "datetime": dt.datetime, "PT": ZoneInfo("America/Los_Angeles"),
                "LOG": logging.getLogger("probe"), "ESPN": {"College Basketball": ("basketball", "mens-college-basketball")},
                "scoreboard_params": scoreboard_params}
          exec(compile(ast.Module(body=nodes, type_ignores=[]), "settle_picks.py", "exec"), ns)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          class Response:
              def __init__(self, data):
                  self.data = data
              def raise_for_status(self):
                  pass
              def json(self):
                  return self.data
          class Session:
              attempts = 0
              def get(self, url, params, timeout):
                  if self.attempts >= 6:
                      raise RuntimeError("request cap")
                  self.attempts += 1
                  req = urllib.request.Request(url + "?" + urllib.parse.urlencode(params),
                       headers={"Accept": "application/json", "User-Agent": "SportsEdgeSettlementProbe/1.0"})
                  with urllib.request.build_opener(NoRedirect()).open(req, timeout=12) as response:
                      raw = response.read(16*1024*1024+1)
                  if len(raw) > 16*1024*1024:
                      raise ValueError("response too large")
                  return Response(json.loads(raw))
          logging.basicConfig(level=logging.INFO)
          session = Session()
          pick = {"id":125, "date":"2026-11-26", "matchup":"Utah State Aggies @ USC Trojans",
                  "market":"h2h", "selection":"USC Trojans"}
          url = "https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard"
          results = {}
          for mode in ("original", "expanded"):
              events = {}
              for day in (25,26,27):
                  date = dt.date(2026,11,day)
                  if mode == "expanded":
                      rows = ns["scoreboard"](session, "College Basketball", date)
                  else:
                      rows = session.get(url, {"dates":date.strftime("%Y%m%d"),"limit":500}, 20).json().get("events",[])
                  for row in rows:
                      if row.get("id"):
                          events[row["id"]] = row
                  print(json.dumps({"mode":mode,"date":str(date),"events":len(rows),"target_event_present":any(str(x.get("id"))=="401921673" for x in rows)}), flush=True)
              match = ns["event_match"](pick, list(events.values()))
              summary = {"mode":mode,"unique_events":len(events),"matched":bool(match)}
              if match:
                  event, parsed = match
                  summary.update({"id":event["id"],"date":event["date"],"home_score":parsed[2],
                                  "away_score":parsed[3],"completed":parsed[4],"grade":ns["grade_pick"](pick,parsed)})
              results[mode] = summary
              print(json.dumps(summary),flush=True)
          print(json.dumps({"requests":session.attempts,"database_queries":0,"paid_api_calls":0}),flush=True)
          assert results["expanded"].get("id") == "401921673" and results["expanded"].get("grade") == "Loss", "Expanded feed did not verify expected game and result"
          PY
