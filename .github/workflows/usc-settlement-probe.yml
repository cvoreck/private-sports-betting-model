name: One-time USC settlement verification
on:
  push:
    branches:
      - diagnostics/usc-settlement-20261127
    paths:
      - '.github/workflows/usc-settlement-probe.yml'
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect exact event metadata (one ESPN request)
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url = "https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard?dates=20261126&limit=500&groups=50"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          with urllib.request.build_opener(NoRedirect()).open(urllib.request.Request(url,headers={"User-Agent":"SportsEdgeSettlementProbe/1.0"}),timeout=12) as response:
              raw=response.read(16*1024*1024+1)
          assert len(raw)<=16*1024*1024
          data=json.loads(raw)
          matches=[e for e in data.get("events",[]) if str(e.get("id"))=="401921673"]
          assert len(matches)==1
          e=matches[0]
          print(json.dumps({"id":e.get("id"),"date":e.get("date"),"name":e.get("name"),"status":e.get("status"),"competitions":[{"id":c.get("id"),"neutralSite":c.get("neutralSite"),"status":c.get("status"),"competitors":[{"homeAway":t.get("homeAway"),"score":t.get("score"),"team":{k:t.get("team",{}).get(k) for k in ("id","displayName","name","shortDisplayName","location","abbreviation")}} for t in c.get("competitors",[])]} for c in e.get("competitions",[])]}),flush=True)
          PY
