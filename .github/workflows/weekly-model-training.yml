
name: Weekly Sports Edge Model Training

on:
  schedule:
    - cron: '0 12 * * 1'

  workflow_dispatch:

jobs:
  train:
    name: Train and evaluate models
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase scikit-learn "psycopg[binary]"

      - name: Train and evaluate models
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sports_betting_cloud/weekly_trainer.py
