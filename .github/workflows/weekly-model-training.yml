
name: Weekly Sports Edge Model Training

on:
  schedule:
    # Every Monday at 12:00 UTC
    - cron: '0 12 * * 1'

  # Allows manual runs from GitHub Actions
  workflow_dispatch:

jobs:
  train:
    name: Train and evaluate models
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase scikit-learn "psycopg[binary]"

      - name: Train and evaluate models
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sports_betting_cloud/weekly_trainer.py
